<!-- trade_window_updated sweet alert -->
    <!-- SweetAlert2 CDN (only include once per page if already loaded remove this line) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {

            const tradeWindowUpdated = {{ trade_window_updated|tojson }};
            const activeAlgo = "{{ session_data.algo_name }}";

            if (tradeWindowUpdated === true) {

                Swal.fire({
                    icon: 'success',
                    title: `${activeAlgo} Trade Window Updated`,
                    html: `
                        <div style="font-size:14px; margin-top:6px;">
                            Trading hours have been saved successfully.
                        </div>
                    `,
                    confirmButtonColor: '#475569',
                    confirmButtonText: 'Perfect',
                    backdrop: `
                        rgba(15,23,42,0.45)
                    `,
                    showClass: {
                        popup: 'animate__animated animate__fadeInDown animate__faster'
                    },
                    hideClass: {
                        popup: 'animate__animated animate__fadeOutUp animate__faster'
                    }
                });

            }

        });
    </script>
<!-- trade_window_updated sweet alert -->








<!-- Algo On off Status Change -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {

        const algoUpdated = {{ algo_updated|tojson }};
        const activeAlgo  = "{{ session_data.algo_name }}";

        if (algoUpdated === true) {

            const isOff = activeAlgo.toLowerCase() === "off";

            const titleText = isOff
                ? "Alpha Algo Off"
                : activeAlgo + " Selected";

            const subText = isOff
                ? "Trading engine has been stopped."
                : "Control Grid settings only affect <strong>" + activeAlgo + "</strong> algo";

            Swal.fire({
                icon: null,
                showConfirmButton: true,
                confirmButtonText: "Continue",
                confirmButtonColor: "#475569",
                background: "#ffffff",
                padding: "2.5em",
                html: `
                    <div style="text-align:center;">

                        <div style="
                            width:72px;
                            height:72px;
                            margin:0 auto 20px auto;
                            border-radius:18px;
                            background:#e2e8f0;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                        ">
                            <i class="fa-solid fa-diagram-project"
                               style="font-size:28px; color:#334155;"></i>
                        </div>

                        <h2 style="
                            font-size:28px;
                            font-weight:700;
                            margin-bottom:12px;
                            color:#1e293b;
                        ">
                            ${titleText}
                        </h2>

                        <div style="
                            font-size:16px;
                            line-height:1.6;
                            color:#475569;
                        ">
                            ${subText}
                        </div>

                    </div>
                `
            });

        }

    });
    </script>
